{% extends 'base.html' %}

{% block title %}Page non trouvée - 404{% endblock %}

{% block content %}
<div class="text-center py-5">
    <div class="error-code">404</div>
    <h2 class="mt-3">Page non trouvée</h2>
    <p class="text-body-secondary">Désolé, la page que vous recherchez n'existe pas.</p>
    {% if exception %}
    <p><small class="text-body-secondary">{{ exception }}</small></p>
    {% endif %}
    <a href="{% url 'home' %}" class="btn btn-primary mt-3">
        <i class="bi bi-house me-1"></i>Retour à l'accueil
    </a>
</div>
{% endblock %}
