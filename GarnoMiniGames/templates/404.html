{% extends 'base.html' %}

{% block title %}Page non trouvée - 404{% endblock %}

{% block content %}
    <div class="error">
        <h1>404</h1>
        <h2>Page non trouvée</h2>
        <p>Désolé, la page que vous recherchez n'existe pas.</p>
        {% if exception %}
            <p><small>{{ exception }}</small></p>
        {% endif %}
        <a href="{% url 'home' %}" class="btn btn-primary mt-3">Retour à l'accueil</a>
    </div>
{% endblock %}
