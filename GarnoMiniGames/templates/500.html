{% extends 'base.html' %}

{% block title %}Erreur serveur{% endblock %}

{% block content %}
<div class="text-center py-5">
    <div class="error-code">500</div>
    <h2 class="mt-3">Une erreur est survenue</h2>
    <p class="text-body-secondary">Désolé, le serveur rencontre un problème. Veuillez réessayer dans quelques instants.
    </p>
    <a href="{% url 'home' %}" class="btn btn-primary mt-3">
        <i class="bi bi-house me-1"></i>Retour à l'accueil
    </a>
</div>
{% endblock %}
