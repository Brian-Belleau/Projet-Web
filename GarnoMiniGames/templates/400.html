{% extends 'base.html' %}

{% block title %}Requête invalide - 400{% endblock %}

{% block content %}
<div class="text-center py-5">
    <div class="error-code">400</div>
    <h2 class="mt-3">Requête invalide</h2>
    <p class="text-body-secondary">Désolé, le serveur n'a pas pu comprendre votre requête. Vérifiez les informations
        envoyées et réessayez.</p>
    <a href="{% url 'home' %}" class="btn btn-primary mt-3">
        <i class="bi bi-house me-1"></i>Retour à l'accueil
    </a>
</div>
{% endblock %}
